[package]
name = "usahp-tauri-demo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "usahp_tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded USAHP broker. Git dep on upstream so the public repo builds for
# anyone; pinned to a rev. Bump after OwenMcGirr/usahp#3 (confidence) merges.
# For local iteration, `[patch.crates-io]` or a local path override works.
usahp-core = { git = "https://github.com/OwenMcGirr/usahp.git", rev = "3636e3c507ef08044cc5cff8f872a9f2a67fe0d9" }
usahp-daemon = { git = "https://github.com/OwenMcGirr/usahp.git", rev = "3636e3c507ef08044cc5cff8f872a9f2a67fe0d9" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native CGEventTap capture (replaces rdev, which traps in TextServices).
core-graphics = "0.25"
core-foundation = "0.10"

