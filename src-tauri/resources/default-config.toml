# Embedded USAHP broker config for the Tauri demo.
# Mirrors usahp/example.toml minus the stdin simulator (no terminal in a GUI).
# NOTE: keyboard mappings are grabbed + suppressed system-wide by rdev when the
# app holds the OS input permission (Accessibility on macOS). Until then the
# grab is inert and these keys pass through to the OS untouched.

[server]
port = 7312
client_queue_capacity = 256

# Demo switches. mapping id == switch_id so on-screen button injection can
# address a switch directly. These keys are grabbed system-wide by rdev while
# the app holds the OS input permission (Accessibility on macOS).
[[mappings]]
id = "switch_1"
switch_id = "switch_1"
input = "keyboard"
code = "Space"

[[mappings]]
id = "switch_2"
switch_id = "switch_2"
input = "keyboard"
code = "Return"

[[mappings]]
id = "switch_3"
switch_id = "switch_3"
input = "keyboard"
code = "LeftArrow"

[[mappings]]
id = "switch_4"
switch_id = "switch_4"
input = "keyboard"
code = "RightArrow"

[[mappings]]
id = "switch_5"
switch_id = "switch_5"
input = "keyboard"
code = "Tab"

[[mappings]]
id = "switch_6"
switch_id = "switch_6"
input = "keyboard"
code = "A"

